{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
      <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
        
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-warning-subtle text-warning mb-2">
            <i class="bi bi-pencil-square fs-3"></i>
          </div>
          <h2 class="fw-bold mb-1">Edit Schedule</h2>
          <p class="text-muted small">Update event timing, priority, or reminder settings.</p>
        </div>

        <form method="POST" class="m-0 p-0 bg-transparent border-0 shadow-none">
          <!-- Title -->
          <div class="mb-3">
            <label class="form-label fw-semibold small text-uppercase text-muted">Schedule Title *</label>
            <input type="text" name="title" class="form-control form-control-lg rounded-3 fs-6" value="{{ schedule.title }}" required>
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="form-label fw-semibold small text-uppercase text-muted">Description / Notes</label>
            <textarea name="description" class="form-control rounded-3" rows="3">{{ schedule.description or '' }}</textarea>
          </div>

          <!-- Date & Time Row -->
          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label fw-semibold small text-uppercase text-muted">Event Date *</label>
              <input type="date" name="date" class="form-control rounded-3" value="{{ schedule.date.strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold small text-uppercase text-muted">Event Time *</label>
              <input type="time" name="time" class="form-control rounded-3" value="{{ schedule.time.strftime('%H:%M') }}" required>
            </div>
          </div>

          <!-- Category & Priority Row -->
          <div class="row g-3 mb-4">
            <div class="col-sm-6">
              <label class="form-label fw-semibold small text-uppercase text-muted">Category</label>
              <select name="category" class="form-select rounded-3">
                <option value="general" {% if schedule.category == 'general' %}selected{% endif %}>📌 General</option>
                <option value="work" {% if schedule.category == 'work' %}selected{% endif %}>💼 Work / Career</option>
                <option value="personal" {% if schedule.category == 'personal' %}selected{% endif %}>👤 Personal</option>
                <option value="study" {% if schedule.category == 'study' %}selected{% endif %}>📚 Study & Learning</option>
                <option value="health" {% if schedule.category == 'health' %}selected{% endif %}>🏃 Health & Fitness</option>
                <option value="finance" {% if schedule.category == 'finance' %}selected{% endif %}>💰 Finance & Bills</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold small text-uppercase text-muted">Priority Level</label>
              <select name="priority" class="form-select rounded-3">
                <option value="low" {% if schedule.priority == 'low' %}selected{% endif %}>🟢 Low Priority</option>
                <option value="medium" {% if schedule.priority == 'medium' %}selected{% endif %}>🟡 Medium Priority</option>
                <option value="high" {% if schedule.priority == 'high' %}selected{% endif %}>🔴 High / Urgent</option>
              </select>
            </div>
          </div>

          <!-- Reminder Options Section -->
          <div class="p-3 rounded-4 bg-light-subtle border border-light-subtle mb-4">
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" role="switch" id="reminderSwitch" name="reminder" {% if schedule.reminder %}checked{% endif %} onchange="toggleReminderOptions(this.checked)">
              <label class="form-check-label fw-bold" for="reminderSwitch">
                <i class="bi bi-bell-fill text-warning me-1"></i> Send Automated Email Alert
              </label>
            </div>

            <div id="reminderConfigBlock" style="display: {{ 'block' if schedule.reminder else 'none' }};">
              <label class="form-label fw-semibold small text-muted">When should we alert you?</label>
              <select name="reminder_offset" class="form-select rounded-3">
                <option value="10_min" {% if schedule.reminder_offset == '10_min' %}selected{% endif %}>⚡ 10 minutes before event</option>
                <option value="1_hour" {% if schedule.reminder_offset == '1_hour' %}selected{% endif %}>🕒 1 hour before event</option>
                <option value="1_day" {% if schedule.reminder_offset == '1_day' %}selected{% endif %}>📅 1 day before event (24 hours notice)</option>
                <option value="1_week" {% if schedule.reminder_offset == '1_week' %}selected{% endif %}>📆 1 week before event</option>
              </select>
              <small class="text-muted d-block mt-1">Alerts will be delivered directly to <strong>{{ current_user.email }}</strong>.</small>
            </div>
          </div>

          <!-- Recurring / Repeat Section -->
          <div class="mb-4">
            <label class="form-label fw-semibold small text-uppercase text-muted">Repeat / Recurrence</label>
            <select name="is_recurring" class="form-select rounded-3">
              <option value="none" {% if schedule.is_recurring == 'none' %}selected{% endif %}>Do not repeat (One-time event)</option>
              <option value="daily" {% if schedule.is_recurring == 'daily' %}selected{% endif %}>🔄 Repeat Daily</option>
              <option value="weekly" {% if schedule.is_recurring == 'weekly' %}selected{% endif %}>🔄 Repeat Weekly</option>
              <option value="monthly" {% if schedule.is_recurring == 'monthly' %}selected{% endif %}>🔄 Repeat Monthly</option>
            </select>
          </div>

          <!-- Submit Buttons -->
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-success btn-lg rounded-pill fw-semibold shadow-sm">
              <i class="bi bi-check2-circle me-1"></i> Save Changes
            </button>
            <a href="{{ url_for('view_schedules') }}" class="btn btn-outline-secondary rounded-pill fw-semibold">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function toggleReminderOptions(checked) {
    const block = document.getElementById('reminderConfigBlock');
    if (block) {
      block.style.display = checked ? 'block' : 'none';
    }
  }
</script>
{% endblock %}
