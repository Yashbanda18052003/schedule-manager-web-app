{% extends "base.html" %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <!-- Modern Signup Card -->
      <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 position-relative overflow-hidden">
        
        <!-- Top Glow Accent -->
        <div class="position-absolute top-0 start-0 w-100" style="height: 4px; background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #8b5cf6 100%);"></div>

        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-3 shadow-sm">
            <i class="bi bi-person-plus-fill fs-3"></i>
          </div>
          <h2 class="fw-bold mb-1">Create Account</h2>
          <p class="text-muted small">Start organizing tasks with automated email reminders</p>
        </div>

        <form method="POST" action="/signup">
          <!-- Full Name -->
          <div class="mb-3">
            <label class="form-label fw-semibold small text-uppercase text-muted">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-person"></i></span>
              <input type="text" name="name" class="form-control border-start-0" placeholder="e.g. Yash Banda" required autofocus>
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label fw-semibold small text-uppercase text-muted">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control border-start-0" placeholder="name@example.com" required>
            </div>
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label class="form-label fw-semibold small text-uppercase text-muted">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-key"></i></span>
              <input type="password" name="password" id="signupPassword" class="form-control border-start-0 border-end-0" placeholder="Choose a strong password" required minlength="4">
              <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePasswordVisibility('signupPassword', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold shadow-sm mb-3">
            Get Started Free
          </button>
        </form>

        <div class="text-center pt-3 border-top border-light-subtle">
          <p class="text-muted small mb-0">Already registered? <a href="/login" class="text-primary fw-bold text-decoration-none">Sign In here</a></p>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function togglePasswordVisibility(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'bi bi-eye';
    }
  }
</script>
{% endblock %}
